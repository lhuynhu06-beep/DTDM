# Spark-on-YARN – cụm tự dựng (t3.medium 4 GiB, 2 worker × 3072 MB / 2 vcores)
spark.master                      yarn
spark.submit.deployMode           client
spark.executor.memory             1g
spark.executor.cores              1
# 3 executor × (1g + 384m overhead → container 1536 MB) + AM/driver 1536 MB = 6144 MB = toàn bộ 2 worker
spark.executor.instances          3
spark.driver.memory               1g
spark.yarn.am.memory              512m
# Jar của Spark được đặt sẵn trên HDFS → mỗi lần submit không phải upload lại ~200 MB
spark.yarn.archive                hdfs://hadoop-master:9000/spark/spark-libs.zip
# S3A (hadoop-aws 3.3.6 + aws-java-sdk-bundle) nằm ở tools/lib, có trên mọi node
spark.driver.extraClassPath       /opt/hadoop/share/hadoop/tools/lib/*
spark.executor.extraClassPath     /opt/hadoop/share/hadoop/tools/lib/*
spark.yarn.am.extraClassPath      /opt/hadoop/share/hadoop/tools/lib/*
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://hadoop-master:9000/spark-logs
spark.history.fs.logDirectory     hdfs://hadoop-master:9000/spark-logs
spark.yarn.historyServer.address  hadoop-master:18080
spark.pyspark.python              python3
